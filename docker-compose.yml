services:
  # -----------------------------------------------------------------
  # Infrastructure: PostgreSQL Database
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: codejit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-codejit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codejit_secret}
      POSTGRES_DB: codejit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codejit} -d codejit"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # Infrastructure: Redis (Cache & Pub/Sub)
  # -----------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: codejit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # Infrastructure: Apache Kafka (KRaft Mode)
  # -----------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: codejit-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  # -----------------------------------------------------------------
  # Microservice: API Gateway (:8080)
  # -----------------------------------------------------------------
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: codejit-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 8081
      ASSESSMENT_SERVICE_HOST: assessment-service
      ASSESSMENT_SERVICE_PORT: 8082
      EXECUTION_SERVICE_HOST: execution-service
      EXECUTION_SERVICE_PORT: 8083
      INTERVIEW_SERVICE_HOST: interview-service
      INTERVIEW_SERVICE_PORT: 8084
      JWT_SECRET: codejit-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-production-signing
    depends_on:
      - auth-service
      - assessment-service
      - execution-service
      - interview-service

  # -----------------------------------------------------------------
  # Microservice: Auth Service (:8081)
  # -----------------------------------------------------------------
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: codejit-auth-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codejit
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DB_USER: ${DB_USER:-codejit}
      DB_PASSWORD: ${DB_PASSWORD:-codejit_secret}
      JWT_SECRET: codejit-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-production-signing
    depends_on:
      postgres:
        condition: service_healthy

  # -----------------------------------------------------------------
  # Microservice: Assessment Service (:8082)
  # -----------------------------------------------------------------
  assessment-service:
    build:
      context: ./backend
      dockerfile: assessment-service/Dockerfile
    container_name: codejit-assessment-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codejit
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DB_USER: ${DB_USER:-codejit}
      DB_PASSWORD: ${DB_PASSWORD:-codejit_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------------------------
  # Microservice: Execution & Judge Service (:8083)
  # -----------------------------------------------------------------
  execution-service:
    build:
      context: ./backend
      dockerfile: execution-service/Dockerfile
    container_name: codejit-execution-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codejit
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DB_USER: ${DB_USER:-codejit}
      DB_PASSWORD: ${DB_PASSWORD:-codejit_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  # -----------------------------------------------------------------
  # Microservice: Interview Service (:8084)
  # -----------------------------------------------------------------
  interview-service:
    build:
      context: ./backend
      dockerfile: interview-service/Dockerfile
    container_name: codejit-interview-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codejit
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DB_USER: ${DB_USER:-codejit}
      DB_PASSWORD: ${DB_PASSWORD:-codejit_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------------------------
  # Frontend Application (:3000)
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codejit-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  kafka_data:
