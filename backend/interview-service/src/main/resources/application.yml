server:
  port: 8084
  error:
    include-message: always

spring:
  application:
    name: interview-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:codejit_interview;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ai:
  interview:
    provider: ${AI_PROVIDER:auto}
    api-key: ${AI_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:}}}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}

